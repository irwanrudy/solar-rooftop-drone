# Path relatif terhadap root project (solar-rooftop-drone/)
input:
  ortho: data/orto/ft_ugm_orto.tif
  aoi: data/aoi/AOI_FT_UGM.shp   # kosongkan untuk clip ke data valid ortofoto
  clip_to_valid_data: true   # clip ke area ber-citra (bukan bounding box)
  valid_mask_max_px: 2000    # resolusi mask data valid (sisi terpanjang)

output:
  dir: output
  buildings_geojson: buildings.geojson
  summary_csv: buildings_summary.csv
  scenarios_csv: solar_scenarios.csv
  map_html: map.html
  publish_copy: docs/index.html   # salinan peta untuk GitHub Pages (kosongkan untuk menonaktifkan)
  sam_raw_geojson: roofs_sam_raw.geojson     # segmen SAM sebelum filter (cache untuk --reuse)
  sam_auto_geojson: roofs_sam_auto.geojson
  sam_guided_geojson: roofs_sam_guided.geojson
  comparison_csv: comparison_summary.csv

map:
  overlay_max_px: 2000   # sisi terpanjang overlay PNG (downsample)

# Estimasi energi (v0.2). Screening berbasis luas, bukan desain teknis.
# Sumber setiap angka: lihat bagian "Referensi" di README.
solar:
  enabled: true
  base_scenario: base
  # Iradiasi global horizontal tahunan di lokasi studi (kWh/m2/tahun).
  # PVGIS-ERA5 2005-2023 di -7.7653, 110.3728: 1917.6 (NASA POWER: 1883 sebagai pembanding).
  annual_ghi_kwh_m2: 1918
  scenarios:
    low:    # konservatif: atap miring/terbatas, modul lebih lama, rugi besar
      utilization_factor: 0.125   # Widodo dkk. 2020 (Semarang, dataran rendah)
      module_efficiency: 0.15     # asumsi MEMR, dikutip Tampubolon dkk. 2019 (IESR)
      performance_ratio: 0.60     # Widodo dkk. 2020, batas bawah rentang derate
    base:   # nilai tengah
      utilization_factor: 0.49    # Triana dkk. 2024 (rumah sedang / apartemen)
      module_efficiency: 0.173    # Triana dkk. 2024, skenario efisiensi 1
      performance_ratio: 0.75     # Widodo dkk. 2020 (derate "tipikal" 0.75)
    high:   # optimistis: atap datar/lapang, modul modern, rugi kecil
      utilization_factor: 0.64    # Triana dkk. 2024 (rumah besar); komersial 0.60
      module_efficiency: 0.228    # Triana dkk. 2024, skenario efisiensi 2
      performance_ratio: 0.80     # Widodo dkk. 2020, batas atas rentang derate

# Deteksi atap dengan SAM (v0.3). Ambang filters: tentatif, disetel lewat inspeksi peta.
sam:
  model_type: vit_l          # vit_b | vit_l | vit_h (keputusan: docs/superpowers/notes/2026-10-20-sam-spike.md)
  checkpoint_dir: models     # bobot diunduh otomatis, tidak di-commit
  device: auto               # auto | cuda | cpu
  working_gsd_m: 0.20        # resolusi kerja (m/piksel); aslinya ~0.074
  tile_px: 1024
  overlap_px: 128
  auto:
    dedupe_iou: 0.7          # buang duplikat di zona overlap tile
    amg:                     # parameter SamAutomaticMaskGenerator
      points_per_side: 48
      pred_iou_thresh: 0.86
      stability_score_thresh: 0.92
      min_mask_region_area: 100
  filters:
    min_area_m2: 30          # run 1 (ambang 10): median hanya-SAM 50 m2, banyak serpihan
    max_area_m2: 6000
    min_solidity: 0.75
    min_brightness: 15       # buang area tanpa data (piksel hitam)
    max_exg: 0.05            # buang vegetasi (Excess Green)
  guided:
    box_pad_m: 2.0           # pelebaran kotak prompt di sekitar denah Overture

compare:
  min_overlap: 0.5           # segmen ditetapkan ke denah bila >= 50% luasnya di dalam denah
  match_iou: 0.5             # denah "cocok" bila IoU gabungan segmen >= ini

overture:
  release: latest        # atau versi tetap, mis. 2026-09-23.1
  min_area_m2: 1.0       # buang serpihan hasil clip di bawah luas ini
  min_buildings_warn: 5  # di bawah ini tampilkan peringatan cakupan

